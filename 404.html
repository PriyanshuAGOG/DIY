<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wrong turn · Do It Yar</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#121311">
  <link rel="icon" href="/assets/img/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --orange: #ff641f; --ink: #20211e; --paper: #f7f5ef; --acid: #c5ef41; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: var(--orange); color: var(--ink); font-family: 'DM Sans', system-ui, sans-serif; text-align: center; }
    main { display: grid; gap: 18px; justify-items: center; max-width: 640px; }
    .no { font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: clamp(110px, 30vw, 260px); line-height: .8; color: transparent; -webkit-text-stroke: 3px var(--ink); }
    h1 { margin: 0; font-family: 'Archivo Black', 'Arial Black', sans-serif; font-weight: 400; text-transform: uppercase; font-size: clamp(28px, 6vw, 52px); line-height: .95; }
    p { margin: 0; font-size: 18px; }
    .mono { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
    a.btn { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 99px; background: var(--ink); color: var(--paper); font-weight: 700; text-decoration: none; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
    a.btn:hover { background: var(--acid); color: var(--ink); }
    img { width: 84px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/logo.webp" alt="Do It Yar">
    <span class="mono">Error 404 · this road is still flat paper</span>
    <div class="no" aria-hidden="true">404</div>
    <h1>You took a wrong turn.</h1>
    <p>This page hasn’t been folded yet. The garage is this way.</p>
    <a class="btn" href="/index.html">Back to the paper garage →</a>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>try{var t=JSON.parse(sessionStorage.getItem("diy.tx")||"null");if(t&&Date.now()-t.t<15000&&localStorage.getItem("diy.calm")!=="true"){document.documentElement.setAttribute("data-tx",t.type);setTimeout(function(){document.documentElement.removeAttribute("data-tx")},5000)}}catch(e){}</script>
  <title>Shop all 15 · Do It Yar</title>
  <meta name="description" content="Every Do It Yar papercraft car: JDM legends, hypercars, Le Mans heroes and a Rolls for the quiet flexers. Shelf-ready kits you build yourself.">
  <meta name="theme-color" content="#121311">
  <link rel="icon" href="../assets/img/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css?v=12">
  <link rel="stylesheet" href="../assets/css/store.css?v=12">
</head>
<body class="grain" data-root="../" data-page="store" data-overlay>
<main id="main">

  <!-- ============ SHOWROOM CAROUSEL ============ -->
  <section class="show" id="show" aria-roledescription="carousel" aria-label="Featured cars">
    <div class="show__scenes" id="scenes" aria-hidden="true"></div>
    <div class="show__name display" id="showName" aria-hidden="true"></div>
    <div class="show__plat" aria-hidden="true"><i class="show__beam"></i><i class="show__deck"></i></div>
    <div class="show__car" id="showCar" data-cursor="Drag"></div>
    <div class="wrap show__copy">
      <span class="mono show__kick" id="showKick"></span>
      <h1 class="display show__title" id="showTitle"></h1>
      <div class="show__sfx" id="showSfx"></div>
      <p class="show__line" id="showLine"></p>
      <div class="show__buy"><span class="show__price" id="showPrice"></span><a class="btn btn--acid" id="showView" href="#">View the kit <span class="arr">→</span></a><button class="btn btn--ghost" id="showAdd">Add to bag</button></div>
    </div>
    <div class="wrap show__ctrl">
      <div class="show__segs" id="segs" role="tablist" aria-label="Choose a featured car"></div>
      <div class="show__arrows"><button class="rnd" id="showPrev" aria-label="Previous car">←</button><button class="rnd rnd--fill" id="showNext" aria-label="Next car">→</button></div>
    </div>
  </section>

  <!-- ============ THE COLLECTIONS: five curated shelves ============ -->
  <section class="res" id="shop">
    <div class="wrap">
      <div class="res__intro">
        <div><span class="mono">The full lineup · 15 kits · 5 collections</span><h2 class="display">Pick a shelf.</h2></div>
        <nav class="res__index" id="colIndex" aria-label="Collections"></nav>
      </div>
      <div class="shelves" id="grid"></div>
    </div>
  </section>
</main>
<div id="footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Flip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="../assets/js/data.js?v=12"></script>
<script src="../assets/js/core.js?v=12"></script>
<script src="../assets/js/scenes.js?v=12"></script>
<script src="../assets/js/store.js?v=12"></script>
</body>
</html>
